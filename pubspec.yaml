name: beity
description: "Beity - Home Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^14.8.1
  
  # Backend
  supabase_flutter: ^2.8.4
  
  # Environment Configuration
  flutter_dotenv: ^5.2.1
  
  # Internationalization
  intl: ^0.20.2
  
  # Local Storage (for later offline support)
  shared_preferences: ^2.3.4
  
  # UI Components
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  
  # Utilities
  uuid: ^4.5.1
  logger: ^2.5.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.2
  
  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/
  
  # fonts:
