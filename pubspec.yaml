name: sawa
description: "SAWA - Home Management App"
publish_to: 'none'
version: 1.0.0+2003

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  
  # State Management
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2
  
  # Routing
  go_router: ^17.3.0
  
  # Backend
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.3
  
  # Environment Configuration
  flutter_dotenv: ^6.0.1
  
  # Internationalization
  intl: ^0.20.2
  
  # Local Storage
  shared_preferences: ^2.5.5
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  
  # UI Components
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  
  # Utilities
  uuid: ^4.5.3
  logger: ^2.7.0
  json_annotation: ^4.12.0
  timeago: ^3.7.1
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^22.0.0-dev.3
  wakelock_plus: ^1.6.1
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  riverpod_generator: ^4.0.4-dev.3
  json_serializable: ^6.14.0
  
  # Testing
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  image_path: "assets/icons/app_icon.png"
